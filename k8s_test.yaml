apiVersion: v1
kind: Pod
metadata:
  name: advanced-test-pod
spec:
  hostPID: true
  hostIPC: true
  hostNetwork: true
  containers:
  - name: malicious-container
    image: ubuntu:latest
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      capabilities:
        add:
        - SYS_ADMIN
        - NET_ADMIN
    env:
    - name: GITHUB_TOKEN
      value: "ghp_1234567890abcdef1234567890abcdef1234"
